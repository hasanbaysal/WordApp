<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Çevrimdışı - WordApp</title>
    <meta name="theme-color" content="#0f121a" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            min-height: 100vh;
            background: #07090e;
            color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
        }
        .card {
            width: 100%;
            max-width: 400px;
            background: #0f121a;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 36px 28px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        }
        .icon {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            margin: 0 auto 20px;
            display: block;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
        }
        h1 {
            font-size: 1.45rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        p {
            color: #9ca3af;
            font-size: 0.95rem;
            line-height: 1.55;
            margin-bottom: 24px;
        }
        button {
            width: 100%;
            padding: 13px 20px;
            border: none;
            border-radius: 12px;
            background: #6366f1;
            color: #ffffff;
            font-size: 0.98rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:active {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="/icons/icon-192.png" alt="WordApp" class="icon" />
        <h1>İnternet Bağlantısı Yok</h1>
        <p>WordApp şu anda sunucuya ulaşamıyor. Bağlantınızı kontrol edip tekrar deneyebilirsiniz.</p>
        <button type="button" onclick="window.location.reload()">Tekrar Dene</button>
    </div>
</body>
</html>
